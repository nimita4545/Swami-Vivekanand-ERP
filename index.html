<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swami Vivekanand School ERP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Sidebar-style Language Toggle (Matching the yellow button in your image) */
        .lang-toggle-wrapper {
            position: fixed;
            top: 20px;
            left: 20px; /* Moved to top-left to match typical sidebar designs */
            z-index: 1000;
        }

        .btn-lang-toggle {
            background-color: #ffcc00; /* Yellow background */
            color: #003366; /* Dark blue text */
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 6px; /* Slightly rounded corners */
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-lang-toggle:hover {
            background-color: #e6b800; /* Slightly darker yellow on hover */
            transform: translateY(-2px);
        }

        /* Adjusting page styles for a cleaner login look */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f8fb;
        }

        /* Optional: If you want to move the brand title down slightly to make room for the button */
        .brand {
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- New Yellow Language Toggle Button -->
    <div class="lang-toggle-wrapper">
        <button type="button" id="langToggleBtn" class="btn-lang-toggle" onclick="toggleLanguage()">
            <span id="langBtnText">English मध्ये बदला</span>
        </button>
    </div>

    <div class="background"></div>
    <div class="overlay"></div>

    <main class="page">

        <header class="brand">
            <h1>स्वामी विवेकानंद</h1>
            <p data-i18n="subtitle">शाळा ईआरपी प्रणाली</p>
        </header>

        <section class="login-card">

            <div class="logo-wrap">
                <img src="education-logo.jpg" alt="Education Logo">
            </div>

            <h2 data-i18n="login_title">लॉगिन</h2>

            <form id="loginForm">

                <label for="username" data-i18n="lbl_username">वापरकर्ता नाव (Username)</label>
                <input
                    type="text"
                    id="username"
                    placeholder="वापरकर्ता नाव प्रविष्ट करा"
                    data-i18n-placeholder="ph_username"
                    required
                >

                <label for="password" data-i18n="lbl_password">पासवर्ड (Password)</label>
                <input
                    type="password"
                    id="password"
                    placeholder="पासवर्ड प्रविष्ट करा"
                    data-i18n-placeholder="ph_password"
                    required
                >

                <div class="role-title" data-i18n="role_title">
                    या नात्याने लॉगिन करा
                </div>

                <div class="roles">
                    <button
                        type="button"
                        class="role active"
                        data-role="student"
                        data-i18n="role_student"
                    >
                        विद्यार्थी
                    </button>

                    <button
                        type="button"
                        class="role"
                        data-role="teacher"
                        data-i18n="role_teacher"
                    >
                        शिक्षक
                    </button>

                    <button
                        type="button"
                        class="role"
                        data-role="admin"
                        data-i18n="role_admin"
                    >
                        प्रशासक (Admin)
                    </button>
                </div>

                <button
                    class="login-btn"
                    type="submit"
                    data-i18n="btn_login"
                >
                    लॉगिन करा
                </button>

                <p id="message" class="message"></p>

            </form>

        </section>

    </main>

    <script src="login.js"></script>

    <!-- Small script to handle the text inside the yellow button -->
    <script>
        // We override the text change so the button says "English" or "मराठी" properly
        const originalToggle = window.toggleLanguage;
        window.toggleLanguage = function() {
            if (originalToggle) originalToggle();
            
            // Change the text inside our new yellow button
            const btnText = document.getElementById('langBtnText');
            if (btnText) {
                // If the page is now in English, show "मराठी मध्ये बदला". Otherwise show "English मध्ये बदला"
                if (document.documentElement.lang === 'en') {
                    btnText.innerText = "मराठी मध्ये बदला";
                } else {
                    btnText.innerText = "English मध्ये बदला";
                }
            }
        };
    </script>

</body>
</html>
